name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Java is required by the Firebase Firestore emulator used in test:rules
      - name: Setup Java (for Firebase emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # ── Build-time environment ───────────────────────────────────────────────
      # No NEXT_PUBLIC_FIREBASE_* variables are needed here. Firebase is
      # initialised at runtime per-tenant via TenantFirebaseProvider; no
      # credentials are baked into the JS bundle at build time.
      #
      # The only value we inject is NEXT_PUBLIC_SITE_URL so that any absolute
      # URL helpers that reference the canonical origin work in the build.
      # All other server-only secrets (FIREBASE_MASTER_*) are injected at
      # deploy time via hosting-platform environment variables — never in CI.
      - name: Create .env for build
        run: |
          cat > .env.local << 'EOF'
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          EOF

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      # Security rules tests run against the local Firebase emulator.
      # firebase-tools is already a devDependency so npx picks it up from
      # node_modules/.bin without a global install.
      # emulators:exec starts the emulator, runs the command, then shuts it down.
      - name: Security rules tests
        run: npx firebase emulators:exec --only firestore "npm run test:rules"

      - name: Build
        run: npm run build
