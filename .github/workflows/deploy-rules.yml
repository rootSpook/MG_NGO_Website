name: Deploy Firebase Rules

# Runs only when security rule files change on the main or develop branch.
# Rules deploy is instant and global — this workflow is gated on the CI
# quality job passing first (branch protection must require "CI / Lint · Test · Build").

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - firestore.rules
      - storage.rules
      - firestore.indexes.json
      - firebase.json
      - .firebaserc

concurrency:
  # One rules deploy at a time per branch to avoid race conditions.
  group: deploy-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Deploy to development project (develop branch) ──────────────────────────
  deploy-rules-dev:
    name: Deploy Rules → Dev
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}

      - name: Deploy Firestore & Storage rules to dev
        run: npx firebase-tools deploy --only firestore:rules,firestore:indexes,storage --project ngo-mg-website-47a1a --non-interactive

  # ── Deploy to production project (main branch) ───────────────────────────────
  deploy-rules-prod:
    name: Deploy Rules → Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}

      - name: Deploy Firestore rules to production
        run: npx firebase-tools deploy --only firestore:rules,firestore:indexes --project ngo-mg-website-47a1a --non-interactive
